version: 1
name: php-aws-app
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Install PHP & tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y php php-cli php-mbstring php-xml php-zip unzip curl
      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer
      - name: Prepare bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod 777 bootstrap/cache
      - name: Disable Composer advisory block policy
        run: composer config --no-interaction -g policy.advisories.block false
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run PHP syntax check
        run: |
          find public routes config bootstrap app -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Install PHP & tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y php php-cli php-mbstring php-xml php-zip unzip
      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer
      - name: Prepare bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod 777 bootstrap/cache
      - name: Disable Composer advisory block policy
        run: composer config --no-interaction -g policy.advisories.block false
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --testdox

  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform Apply
        id: tf_apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra
      - name: Get EC2 IP
        id: get_ip
        run: |
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.instance_ip }}

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Install Ansible
        run: pip install ansible-core
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Get instance IP
        id: get_ip
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Scan host keys
        run: ssh-keyscan -H "${{ steps.get_ip.outputs.instance_ip }}" >> ~/.ssh/known_hosts
      - name: Generate inventory
        run: |
          cat > /tmp/inventory.ini <<EOF
          [web]
          ${{ steps.get_ip.outputs.instance_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key
          EOF
      - name: Run Ansible playbook
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
        run: |
          ansible-playbook -i /tmp/inventory.ini ansible/site.yml \
            -e "app_key=${{ secrets.APP_KEY }}" \
            -e "app_env=production"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Get instance IP
        id: get_ip
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.instance_ip }}/

rollback:
  strategy: manual
